# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/how-to/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_trade-imports-animals-frontend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/trade-imports-animals-frontend
sonar.links.ci=https://github.com/DEFRA/trade-imports-animals-frontend/actions
sonar.links.scm=https://github.com/DEFRA/trade-imports-animals-frontend
sonar.links.issue=https://github.com/DEFRA/trade-imports-animals-frontend/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js,src/**/*.fit.spec.js
sonar.tests=src/
sonar.test.inclusions=src/**/*.test.js,src/**/*.fit.spec.js

sonar.javascript.lcov.reportPaths=./coverage/lcov.info

# Browser bundles — vitest cannot execute them and the Playwright suites
# prove them. Still analysed for issues, just not measured for coverage.
# fit/axe.js is the per-group accessibility-check helper, proven by the fit
# suite (test:fit) rather than vitest, same as the browser bundles above.
sonar.coverage.exclusions=src/client/**,src/server/app/sets/live-animals/journeys/linear/features/documents/client/**,src/**/fit/axe.js

# copy.en.js / copy.cy.js are parallel language decks, the address-book
# stubs are canned party records, and fit/axe.js is copied byte-identical
# into every group folder — feature folders are independent by design, so
# all three are duplicate-shaped on purpose.
sonar.cpd.exclusions=**/config.js,src/**/*.test.js,src/**/*.fit.spec.js,src/**/copy.??.js,src/server/app/services/address-book/stub/**,src/**/fit/axe.js

# readDate returns a parsed date or passes the raw string through for
# redisplay; callers branch on typeof, so a single return type is not possible.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3800
sonar.issue.ignore.multicriteria.e1.resourceKey=src/server/app/shared/kit.js
