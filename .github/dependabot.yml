# Generated by `tim deps dependabot trade-imports-animals-frontend --write` from
# config/dependency-sets.json in the trade-imports workspace. Change that
# file and regenerate. A hand edit here fails `--check`.
version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Dependabot puts a dependency in the first group it matches, so each
    # coupled set comes before the catch-all. A set takes every update type,
    # so even a major arrives as one PR for the whole set.
    groups:
      # neostandard and the plugins declare eslint as a peer, so bumping
      # eslint alone leaves an install that npm refuses or a config that no
      # longer loads.
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - '@eslint/*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
          - 'neostandard'
          - 'globals'
          - 'typescript-eslint'
          - '@typescript-eslint/*'

      # @vitest/coverage-v8 and the other @vitest packages pin the exact
      # vitest version they were released with.
      vitest:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'

      # One rolling PR for every other patch and minor bump. Majors match no
      # group, so Dependabot raises each one on its own: they are the
      # likeliest to break, and the nightly job reads their changelogs before
      # merging.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

    # The nightly job moves these sets in every repo at once, on one branch
    # name, so Dependabot leaves them alone. A held package stays at its
    # current version: Dependabot does not propose the versions it breaks.
    ignore:
      # playwright
      # The frontends record traces that the tests repo and tim read, and a
      # trace from one Playwright version will not open in another, so every
      # repo moves to the same version on one branch name.
      - dependency-name: 'playwright'
      - dependency-name: 'playwright-core'
      - dependency-name: '@playwright/*'
      # govuk-frontend
      # Its minors ship new components, deprecations and visual changes that
      # green CI cannot prove were applied, so every version goes through the
      # govuk-upgrade skill, one version at a time, across every frontend.
      - dependency-name: 'govuk-frontend'
      # held: stylelint, since 2026-11-19
      # stylelint-config-gds 3.0.0, the newest release, has a peer of
      # stylelint ^17.4.0, so stylelint 18 fails npm ci with ERESOLVE
      # Failing test: npm ci (Run Pull Request Checks)
      # Lift it with tim deps lift when a newer stylelint or
      # stylelint-config-gds clears it.
      # https://github.com/DEFRA/trade-imports-animals-admin/pull/99
      - dependency-name: 'stylelint'
        versions:
          - '18.x'

    # Wait 7 days after a release before proposing it, so a broken release is
    # usually withdrawn first.
    cooldown:
      default-days: 7

    # Check for updates on this schedule, local time
    schedule:
      interval: daily
      time: '10:30'
      timezone: 'Europe/London'

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Same policy as npm: one rolling PR for patch and minor bumps, majors
    # raised one at a time. Action majors change inputs or runtime, so they
    # are the ones worth reading.
    groups:
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - 'patch'
          - 'minor'
        patterns:
          - '*'

    # Wait 7 days after a release before proposing it, so a broken release is
    # usually withdrawn first.
    cooldown:
      default-days: 7

    # Check for updates on this schedule, local time
    schedule:
      interval: daily
      time: '10:30'
      timezone: 'Europe/London'
