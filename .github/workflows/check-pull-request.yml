name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm version is load-bearing: different npms resolve some transitive
      # trees differently, and `npm ci` then rejects a lockfile generated by
      # the other one. Take it from `packageManager` in package.json rather
      # than inheriting whatever .nvmrc's Node happens to bundle, so the pin
      # survives a Node bump and there is one place to change it. The helper
      # validates the field and strips any Corepack integrity suffix, so a
      # malformed pin fails the step instead of installing the wrong npm.
      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - run: |
          npm run build:frontend
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        run: |
          set +e
          docker build --no-cache --tag cdp-node-frontend-template .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deliberately a separate job from pr-validator. `npm audit` scans the whole
  # installed tree against a live advisory feed, so a newly published advisory
  # turns every open PR red regardless of what that PR changed — and advisories
  # on indirect dependencies often have no upgrade path, needing a hand-written
  # `overrides` entry on main to clear. Folded into pr-validator, that failure
  # mode blocks the very PR carrying the fix. Kept separate, the audit stays
  # visible on every PR without being the check that gates the merge.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run security-audit

  # The frontend owns two Playwright projects — `features` and `journeys` —
  # which boot the app themselves in stub mode with auth off, so they need no
  # workspace stack, unlike the separate "E2E Tests" check. Kept out of
  # pr-validator so a browser run does not sit in front of the Sonar signal.
  playwright:
    name: Frontend Playwright suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Align npm with the version pinned in package.json
        run: npm install --global "$(node scripts/npm-version.js)"

      - name: Install dependencies
        run: npm ci

      # Chromium only: both projects use devices['Desktop Chrome'].
      - name: Install the Playwright browser
        run: npm run playwright:install

      - name: Run the frontend-owned Playwright suites
        run: npm run test:fit:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
