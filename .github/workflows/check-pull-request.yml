name: Check Pull Request

on:
  schedule:
    - cron: '0 7 * * 1'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test code and Create Test Coverage Reports
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - run: |
          npm run format:check
          npm run lint
          npm test

      - name: Test Docker Image Build
        if: >
          github.event_name != 'pull_request' ||
          github.actor == 'dependabot[bot]' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          set +e
          docker build --no-cache --tag trade-imports-animals-frontend .
          exit $?

      - name: SonarCloud Scan
        if: github.actor != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Deliberately a separate job from pr-validator. The audit (audit-ci over
  # `npm audit`) scans the whole installed tree against a live advisory feed,
  # so a newly published advisory turns every open PR red regardless of what
  # that PR changed — and advisories on indirect dependencies often have no
  # upgrade path, needing an `overrides` entry or an audit-ci.jsonc allowlist
  # entry on main to clear. Folded into pr-validator, that failure mode blocks
  # the very PR carrying the fix. Kept separate, the audit stays visible on
  # every PR without being the check that gates the merge.
  #
  # Before the audit, "Check audit allowlist" enforces the allowlist rules:
  # every entry is {"GHSA-...": {active: true, notes, expiry}}, the notes give
  # a reason and "Owner: <name>", and the expiry is a real date no more than
  # 3 months away. An expired entry is named as EXPIRED, which audit-ci alone
  # does not say. The weekly cron catches expiries between PRs.
  security-audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check audit allowlist
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          limit=$(date -u -d '+3 months' +%F)
          problems=$(jq -r --arg today "$today" --arg limit "$limit" '
            .allowlist[]
            | if type != "object" or length == 0 then "\(tojson): must be {\"GHSA-...\": {active, notes, expiry}}"
              else to_entries[] | .key as $id | .value as $e
                | if ($e | type) != "object" then "\($id): must be {active, notes, expiry}"
                  else
                    (if ($id | test("^GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}$") | not) then "\($id): key is not a GHSA ID" else empty end),
                    (if $e.active != true then "\($id): active must be true, or audit-ci ignores the entry" else empty end),
                    (if (($e.notes // "") | tostring | test("\\S.*Owner: \\S")) | not then "\($id): notes must give a reason and \"Owner: <name>\"" else empty end),
                    (if ($e.expiry | type) != "string"
                        or ($e.expiry | try (strptime("%Y-%m-%d") | mktime | strftime("%Y-%m-%d")) catch null) != $e.expiry
                       then "\($id): expiry is missing or not a real YYYY-MM-DD date"
                     elif $e.expiry <= $today then "\($id): EXPIRED on \($e.expiry). Re-check the advisory, then renew or remove the entry"
                     elif $e.expiry > $limit then "\($id): expiry \($e.expiry) is more than 3 months away (latest allowed \($limit))"
                     else empty end)
                  end
              end' audit-ci.jsonc)
          if [ -n "$problems" ]; then
            echo "::error title=Audit allowlist::audit-ci.jsonc breaks the allowlist rules"
            echo "$problems"
            exit 1
          fi
          echo "Audit allowlist entries meet the rules"

      - name: Security audit
        run: npm run security-audit

  playwright-version:
    name: Playwright version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - name: Checkout package lock
        uses: actions/checkout@v7
        with:
          sparse-checkout: package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the locked Playwright version
        id: lock
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  playwright:
    name: FIT Tests ${{ matrix.shard }} of 3
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run this shard of the frontend-owned Playwright suites
        run: >-
          npm run test:fit:ci --
          --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --reporter=list,blob,github

      - name: Upload this shard's blob report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fit-blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  playwright-report:
    name: FIT Tests
    needs: playwright
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's blob report
        uses: actions/download-artifact@v8
        with:
          pattern: fit-blob-report-*
          path: all-blob-reports/
          merge-multiple: true

      - name: Merge the shards into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Fail unless every shard passed
        if: needs.playwright.result != 'success'
        run: |
          echo "::error::A FIT shard finished ${{ needs.playwright.result }}; the merged report shows which tests failed"
          exit 1
